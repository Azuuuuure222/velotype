name: Build Velotype for Void musl

on:
  push:
    branches: [main]
    paths:
      - "srcpkgs/velotype/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velotype-musl-${{ github.ref }}
  cancel-in-progress: true

env:
  XBPS_TARGET_ARCH: x86_64-musl
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free runner disk space only when needed
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail -k / | tail -1 | tr -d ' ')"
          if [ "$available_kib" -lt $((25 * 1024 * 1024)) ]; then
            echo "Less than 25 GiB available; cleaning unneeded preinstalled SDKs."
            sudo rm -rf -- \
              /usr/share/dotnet \
              /usr/share/swift \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/.ghcup \
              /usr/local/share/boost \
              /usr/local/share/powershell \
              /usr/local/lib/node_modules
          else
            echo "Sufficient disk space available; skipping runner cleanup."
          fi
          df -h /

      - name: Checkout package repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read pinned source metadata
        id: source
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' srcpkgs/velotype/template)"
          commit="$(sed -n 's/^_commit=//p' srcpkgs/velotype/template)"
          checksum="$(sed -n 's/^checksum=//p' srcpkgs/velotype/template)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Checkout void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: Restore pinned source cache
        id: source-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/sources/velotype-${{ steps.source.outputs.version }}
          key: velotype-source-v2-${{ steps.source.outputs.commit }}-${{ steps.source.outputs.checksum }}

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/cargo/registry
          key: velotype-cargo-v1-${{ steps.source.outputs.commit }}
          restore-keys: |
            velotype-cargo-v1-

      - name: Restore Void binary package cache
        id: xbps-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          # v2 invalidates the early, incomplete cache saved by the first workflow.
          key: void-repocache-v2-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}
          restore-keys: |
            void-repocache-v2-${{ env.XBPS_TARGET_ARCH }}-

      - name: Verify source checksum and overlay package
        run: |
          set -euo pipefail
          bash -n srcpkgs/velotype/template
          bash -n scripts/prepare-source.sh
          bash -n scripts/test-xattr-patch.sh
          bash scripts/test-xattr-patch.sh
          ./scripts/prepare-source.sh "void-packages/hostdir/sources/velotype-${{ steps.source.outputs.version }}"
          mkdir -p void-packages/srcpkgs/velotype
          cp -a srcpkgs/velotype/. void-packages/srcpkgs/velotype/

      - name: Save verified source archive
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/sources/velotype-${{ steps.source.outputs.version }}
          key: velotype-source-v2-${{ steps.source.outputs.commit }}-${{ steps.source.outputs.checksum }}

      - name: Install static xbps
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output /tmp/xbps-static.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf /tmp/xbps-static.tar.xz -C /opt/xbps
          rm -f /tmp/xbps-static.tar.xz
          echo "/opt/xbps/usr/bin" >> "$GITHUB_PATH"

      - name: Bootstrap xbps-src for musl
        working-directory: void-packages
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          printf '%s\n' 'XBPS_MAKEJOBS=2' >> etc/conf
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: Build package
        working-directory: void-packages
        run: |
          set -euo pipefail
          ./xbps-src -A "$XBPS_TARGET_ARCH" pkg velotype
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mapfile -t packages < <(
            find hostdir/binpkgs -type f -name "velotype-${{ steps.source.outputs.version }}_*.xbps" -print
          )
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected one Velotype package, found %s\n' "${#packages[@]}" >&2
            find hostdir/binpkgs -type f -name '*velotype*.xbps' -print >&2
            exit 1
          fi
          cp "${packages[0]}" "$GITHUB_WORKSPACE/dist/"
          sha256sum "$GITHUB_WORKSPACE"/dist/*.xbps

      - name: Upload xbps package
        uses: actions/upload-artifact@v7
        with:
          name: velotype-x86_64-musl
          path: dist/*.xbps
          if-no-files-found: error

      - name: Save Cargo registry cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/cargo/registry
          key: velotype-cargo-v1-${{ steps.source.outputs.commit }}

      - name: Save Void binary package cache
        if: always() && steps.xbps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v2-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}
